# Deploy della app Streamlit su Render come Web Service.
# Render fornisce la porta nella variabile $PORT.
# NB: il filesystem di Render e' effimero: acquisti.db si azzera ad ogni redeploy.
services:
  - type: web
    name: assistente-asta-mantra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
